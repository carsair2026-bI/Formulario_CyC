<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Gestión Comercial</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f5f7;
    color: #333;
}

.header {
    background: #e51c22;
    color: white;
    padding: 18px 25px;
    box-shadow: 0 3px 10px rgba(0,0,0,.15);
}

.header-content {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.header-title {
    font-size: 20px;
    font-weight: 600;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 18px 40px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.card-title {
    margin: 0 0 20px;
    font-size: 19px;
    font-weight: 700;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.field {
    display: flex;
    flex-direction: column;
}

.field label {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 7px;
}

.field input,
.field select {
    width: 100%;
    height: 46px;
    border: 1px solid #d8d8d8;
    border-radius: 9px;
    padding: 0 13px;
    font-size: 14px;
    outline: none;
    background: white;
}

.field input:focus,
.field select:focus {
    border-color: #e51c22;
    box-shadow: 0 0 0 3px rgba(229,28,34,.10);
}

.field select:disabled {
    background: #f1f1f1;
    color: #999;
    cursor: not-allowed;
}

.question-card {
    background: white;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,.07);
}

.question-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 34px;
    height: 34px;
    padding: 0 10px;
    border-radius: 50px;
    background: #e51c22;
    color: white;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 12px;
}

.question-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 17px;
    line-height: 1.4;
}

.options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.option {
    position: relative;
}

.option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.option label {
    display: flex;
    align-items: center;
    min-height: 48px;
    padding: 11px 14px;
    border: 1px solid #ddd;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1.35;
    transition: .2s;
}

.option label:hover {
    border-color: #e51c22;
    background: #fff7f7;
}

.option input:checked + label {
    border-color: #e51c22;
    background: #ffecee;
    color: #b9151a;
    font-weight: 700;
}

.required {
    color: #e51c22;
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 25px;
}

.btn {
    border: 0;
    border-radius: 9px;
    height: 48px;
    padding: 0 28px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.btn-primary {
    background: #e51c22;
    color: white;
}

.btn-primary:hover {
    background: #c9151b;
}

.btn-primary:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.btn-secondary {
    background: #e9e9e9;
    color: #444;
}

.loading {
    text-align: center;
    padding: 40px 20px;
    color: #666;
}

.message {
    display: none;
    padding: 15px 18px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 14px;
    font-weight: 600;
}

.message.success {
    display: block;
    background: #e9f8ed;
    color: #197333;
    border: 1px solid #b9e4c3;
}

.message.error {
    display: block;
    background: #fff0f0;
    color: #c4161c;
    border: 1px solid #f0b9bb;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

@media (max-width: 700px) {
    .header-content {
        flex-direction: column;
        align-items: flex-start;
    }

    .grid,
    .options {
        grid-template-columns: 1fr;
    }

    .card,
    .question-card {
        padding: 18px;
    }

    .actions {
        flex-direction: column;
    }

    .btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-content">
        <div class="logo">CARSA</div>
        <div class="header-title">Registro de Gestión Comercial</div>
    </div>
</header>

<main class="container">

    <div id="mensaje" class="message"></div>

    <form id="formulario">

        <div class="card">

            <h2 class="card-title">Datos del registro</h2>

            <div class="grid">

                <div class="field">
                    <label for="region">
                        Región <span class="required">*</span>
                    </label>

                    <select id="region" required>
                        <option value="">Seleccione región</option>
                    </select>
                </div>

                <div class="field">
                    <label for="codigoTienda">
                        Tienda <span class="required">*</span>
                    </label>

                    <select id="codigoTienda" required disabled>
                        <option value="">Seleccione tienda</option>
                    </select>
                </div>

                <div class="field">
                    <label for="dniFuncionario">
                        DNI funcionario <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="dniFuncionario"
                        maxlength="15"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="field">
                    <label for="dniCliente">
                        Código de cliente <span class="required">*</span>
                    </label>

                    <select id="dniCliente" required disabled>
                        <option value="">Seleccione cliente</option>
                    </select>
                </div>

                <div class="field">
                    <label for="tipoDocCliente">
                        Tipo documento cliente <span class="required">*</span>
                    </label>

                    <select id="tipoDocCliente" required>
                        <option value="">Seleccione</option>
                        <option value="DNI">DNI</option>
                        <option value="CE">CE</option>
                        <option value="PASAPORTE">PASAPORTE</option>
                        <option value="OTRO">OTRO</option>
                    </select>
                </div>

            </div>

        </div>

        <div id="contenedorPreguntas">
            <div class="loading">
                Cargando preguntas...
            </div>
        </div>

        <div class="card">

            <div class="actions">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="limpiarFormulario()"
                >
                    Limpiar
                </button>

                <button
                    type="submit"
                    id="btnGuardar"
                    class="btn btn-primary"
                >
                    Registrar
                </button>

            </div>

        </div>

    </form>

</main>

<script>

const API_URL = 'AKfycbxjuKy636oJTr1HSD--BqYSpMYy5oeqiNUL_sbnXeJNTuAvAokPSnqvJuQiKSSbe2HeMA';

let preguntas = [];

let maestro = {
    REGIONES: [],
    TIENDAS: {},
    CLIENTES: {}
};

document.addEventListener(
    'DOMContentLoaded',
    iniciar
);

async function iniciar() {

    try {

        await Promise.all([
            cargarMaestro(),
            cargarPreguntas()
        ]);

    } catch (error) {

        mostrarMensaje(
            'No se pudo cargar la información inicial.',
            'error'
        );
    }
}

async function cargarMaestro() {

    const response = await fetch(
        API_URL + '?action=maestro'
    );

    if (!response.ok) {
        throw new Error(
            'No se pudo cargar el maestro'
        );
    }

    maestro = await response.json();

    cargarRegiones();
}

function cargarRegiones() {

    const select = document.getElementById('region');

    select.innerHTML =
        '<option value="">Seleccione región</option>';

    maestro.REGIONES.forEach(function(region) {

        const option =
            document.createElement('option');

        option.value = region;
        option.textContent = region;

        select.appendChild(option);
    });
}

document
    .getElementById('region')
    .addEventListener(
        'change',
        cargarTiendas
    );

function cargarTiendas() {

    const region =
        document.getElementById('region').value;

    const tienda =
        document.getElementById('codigoTienda');

    const cliente =
        document.getElementById('dniCliente');

    tienda.innerHTML =
        '<option value="">Seleccione tienda</option>';

    cliente.innerHTML =
        '<option value="">Seleccione cliente</option>';

    cliente.disabled = true;

    if (!region) {

        tienda.disabled = true;
        return;
    }

    const tiendas =
        maestro.TIENDAS[region] || [];

    tiendas.forEach(function(nombre) {

        const option =
            document.createElement('option');

        option.value = nombre;
        option.textContent = nombre;

        tienda.appendChild(option);
    });

    tienda.disabled = false;
}

document
    .getElementById('codigoTienda')
    .addEventListener(
        'change',
        cargarClientes
    );

function cargarClientes() {

    const tienda =
        document.getElementById('codigoTienda').value;

    const cliente =
        document.getElementById('dniCliente');

    cliente.innerHTML =
        '<option value="">Seleccione cliente</option>';

    if (!tienda) {

        cliente.disabled = true;
        return;
    }

    const clientes =
        maestro.CLIENTES[tienda] || [];

    clientes.forEach(function(codigo) {

        const option =
            document.createElement('option');

        option.value = codigo;
        option.textContent = codigo;

        cliente.appendChild(option);
    });

    cliente.disabled = false;
}

async function cargarPreguntas() {

    const contenedor =
        document.getElementById(
            'contenedorPreguntas'
        );

    try {

        const response = await fetch(
            API_URL + '?action=preguntas'
        );

        if (!response.ok) {
            throw new Error(
                'No se pudo consultar el maestro'
            );
        }

        const data =
            await response.json();

        preguntas = data;

        renderizarPreguntas();

    } catch (error) {

        contenedor.innerHTML = `
            <div class="question-card">
                <div class="message error" style="display:block">
                    No se pudieron cargar las preguntas.
                </div>
            </div>
        `;

        throw error;
    }
}

function renderizarPreguntas() {

    const contenedor =
        document.getElementById(
            'contenedorPreguntas'
        );

    if (!preguntas.length) {

        contenedor.innerHTML = `
            <div class="question-card">
                <div class="empty">
                    No existen preguntas activas.
                </div>
            </div>
        `;

        return;
    }

    contenedor.innerHTML = '';

    preguntas.forEach(function(
        pregunta,
        index
    ) {

        const card =
            document.createElement('div');

        card.className =
            'question-card';

        const numero =
            document.createElement('div');

        numero.className =
            'question-number';

        numero.textContent =
            index + 1;

        const titulo =
            document.createElement('div');

        titulo.className =
            'question-title';

        titulo.innerHTML =
            escaparHTML(
                pregunta.PREGUNTA
            ) +
            ' <span class="required">*</span>';

        const opciones =
            document.createElement('div');

        opciones.className =
            'options';

        pregunta.RESPUESTAS.forEach(
            function(
                respuesta,
                respuestaIndex
            ) {

                const option =
                    document.createElement('div');

                option.className =
                    'option';

                const idRadio =
                    'pregunta_' +
                    pregunta.ID_PREGUNTA +
                    '_' +
                    respuestaIndex;

                option.innerHTML = `
                    <input
                        type="radio"
                        id="${idRadio}"
                        name="pregunta_${pregunta.ID_PREGUNTA}"
                        value="${escaparHTML(respuesta.ID_RESPUESTA)}"
                        required
                    >

                    <label for="${idRadio}">
                        ${escaparHTML(respuesta.RESPUESTA)}
                    </label>
                `;

                opciones.appendChild(option);
            }
        );

        card.appendChild(numero);
        card.appendChild(titulo);
        card.appendChild(opciones);

        contenedor.appendChild(card);
    });
}

document
    .getElementById('formulario')
    .addEventListener(
        'submit',
        async function(event) {

            event.preventDefault();

            ocultarMensaje();

            if (!this.checkValidity()) {

                this.reportValidity();

                return;
            }

            const respuestas = [];

            for (const pregunta of preguntas) {

                const seleccionada =
                    document.querySelector(
                        `input[name="pregunta_${pregunta.ID_PREGUNTA}"]:checked`
                    );

                if (!seleccionada) {

                    mostrarMensaje(
                        'Debe responder todas las preguntas.',
                        'error'
                    );

                    return;
                }

                respuestas.push({
                    ID_PREGUNTA:
                        pregunta.ID_PREGUNTA,

                    ID_RESPUESTA:
                        seleccionada.value
                });
            }

            const payload = {

                REGION:
                    document.getElementById(
                        'region'
                    ).value,

                CODIGO_TIENDA:
                    document.getElementById(
                        'codigoTienda'
                    ).value,

                DNI_FUNCIONARIO:
                    document.getElementById(
                        'dniFuncionario'
                    ).value.trim(),

                TIPO_DOC_CLIENTE:
                    document.getElementById(
                        'tipoDocCliente'
                    ).value,

                DNI_CLIENTE:
                    document.getElementById(
                        'dniCliente'
                    ).value,

                RESPUESTAS:
                    respuestas
            };

            const boton =
                document.getElementById(
                    'btnGuardar'
                );

            boton.disabled = true;
            boton.textContent =
                'Registrando...';

            try {

                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type':
                            'text/plain;charset=utf-8'
                    },
                    body:
                        JSON.stringify(payload)
                });

                mostrarMensaje(
                    'Registro guardado correctamente.',
                    'success'
                );

                limpiarFormulario(false);

                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });

            } catch (error) {

                mostrarMensaje(
                    'No se pudo enviar el registro.',
                    'error'
                );

            } finally {

                boton.disabled = false;
                boton.textContent =
                    'Registrar';
            }
        }
    );

function limpiarFormulario(
    mostrar = true
) {

    document
        .getElementById('formulario')
        .reset();

    const tienda =
        document.getElementById(
            'codigoTienda'
        );

    const cliente =
        document.getElementById(
            'dniCliente'
        );

    tienda.innerHTML =
        '<option value="">Seleccione tienda</option>';

    cliente.innerHTML =
        '<option value="">Seleccione cliente</option>';

    tienda.disabled = true;
    cliente.disabled = true;

    if (mostrar) {
        ocultarMensaje();
    }
}

function mostrarMensaje(
    texto,
    tipo
) {

    const mensaje =
        document.getElementById(
            'mensaje'
        );

    mensaje.textContent =
        texto;

    mensaje.className =
        'message ' + tipo;
}

function ocultarMensaje() {

    const mensaje =
        document.getElementById(
            'mensaje'
        );

    mensaje.textContent = '';

    mensaje.className =
        'message';
}

function escaparHTML(valor) {

    return String(valor)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

</script>

</body>
</html>

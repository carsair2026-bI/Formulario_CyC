<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro de Gestión Comercial</title>
<link
    rel="icon"
    type="image/png"
    href="https://carsair2026-bi.github.io/Formulario_CyC/icon.png">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f5f7;
    color: #202124;
}

body {
    overflow-x: hidden;
}

.header {
    width: 100%;
    height: 105px;
    background: #ed1c24;
    box-shadow: 0 4px 12px rgba(0,0,0,.18);
    display: flex;
    align-items: center;
}

.header-content {
    width: 100%;
    max-width: 1400px;
    margin: auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    height: 48px;
    width: auto;
    max-width: 220px;
    object-fit: contain;
}

.header-title {
    color: #fff;
    font-size: 29px;
    font-weight: 700;
    text-align: right;
}

.container {
    width: 100%;
    max-width: 1400px;
    margin: 38px auto;
    padding: 0 28px 50px;
}

.message {
    width: 100%;
    padding: 18px 24px;
    margin-bottom: 28px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    display: none;
}

.message.success {
    display: block;
    background: #edf9f0;
    border: 1px solid #b8e0c1;
    color: #187333;
}

.message.error {
    display: block;
    background: #fff0f1;
    border: 1px solid #f2b9bc;
    color: #c81920;
}

.card {
    width: 100%;
    background: #fff;
    border-radius: 22px;
    padding: 34px;
    margin-bottom: 28px;
    box-shadow: 0 6px 22px rgba(0,0,0,.08);
}

.card-title {
    margin: 0 0 27px;
    font-size: 27px;
    line-height: 1.2;
    font-weight: 700;
    color: #202124;
    display: flex;
    align-items: center;
    gap: 12px;
}

.grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 25px;
    row-gap: 22px;
}

.field {
    width: 100%;
    display: flex;
    flex-direction: column;
}

.field label {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 10px;
    color: #202124;
}

.required {
    color: #ed1c24;
}

.field input,
.field select {
    width: 100%;
    height: 62px;
    border: 1px solid #d9d9d9;
    border-radius: 13px;
    background: #fff;
    padding: 0 20px;
    font-size: 18px;
    color: #161616;
    outline: none;
    transition: all .2s ease;
}

.field input:focus,
.field select:focus {
    border-color: #ed1c24;
    box-shadow: 0 0 0 3px rgba(237,28,36,.10);
}

.field select:disabled {
    background: #f4f4f4;
    color: #b6b6b6;
    cursor: not-allowed;
}

.question-card {
    width: 100%;
    background: #fff;
    border-radius: 22px;
    padding: 34px;
    margin-bottom: 28px;
    box-shadow: 0 6px 22px rgba(0,0,0,.08);
}

.question-number {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #ed1c24;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 15px;
}

.question-title {
    font-size: 20px;
    line-height: 1.45;
    font-weight: 700;
    color: #202124;
    margin-bottom: 20px;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.option {
    position: relative;
}

.option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.option label {
    min-height: 60px;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 13px 17px;
    border: 1px solid #d8d8d8;
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    font-size: 16px;
    line-height: 1.4;
    transition: all .2s ease;
}

.option label:hover {
    border-color: #ed1c24;
    background: #fff7f7;
}

.option input:checked + label {
    border-color: #ed1c24;
    background: #fff0f1;
    color: #c71920;
    font-weight: 700;
    box-shadow: 0 0 0 1px #ed1c24;
}

.loading {
    width: 100%;
    text-align: center;
    padding: 50px;
    font-size: 18px;
    color: #777;
}

.empty {
    width: 100%;
    text-align: center;
    padding: 35px;
    color: #777;
    font-size: 17px;
}

.actions {
    width: 100%;
    display: flex;
    justify-content: flex-end;
    gap: 14px;
}

.btn {
    height: 58px;
    padding: 0 34px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s ease;
}

.btn-primary {
    background: #ed1c24;
    color: #fff;
}

.btn-primary:hover {
    background: #cf151c;
}

.btn-primary:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.btn-secondary {
    background: #eeeeee;
    color: #333;
}

.btn-secondary:hover {
    background: #dedede;
}

/* ---- Panel de detalle del cliente ---- */

.detalle-grid {
    grid-template-columns: repeat(3, 1fr);
}

.detalle-item {
    display: flex;
    flex-direction: column;
    background: #f8f9fb;
    border: 1px solid #ececec;
    border-radius: 12px;
    padding: 14px 16px;
}

.detalle-item-completo {
    grid-column: 1 / -1;
}

.detalle-etiqueta {
    font-size: 12px;
    font-weight: 700;
    color: #8a8a8a;
    text-transform: uppercase;
    letter-spacing: .03em;
    margin-bottom: 6px;
}

.detalle-valor {
    font-size: 16px;
    font-weight: 600;
    color: #202124;
    word-break: break-word;
}

.badge-estado {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 700;
}

.badge-aprobado {
    background: #eafaf0;
    color: #187333;
}

.badge-rechazado {
    background: #fff0f1;
    color: #c81920;
}

.badge-pendiente {
    background: #fff8e6;
    color: #9a6b00;
}

.badge-otro {
    background: #eef0f2;
    color: #555;
}

@media (max-width: 900px) {

    .header {
        height: auto;
        min-height: 95px;
    }

    .header-content {
        padding: 18px 24px;
        gap: 15px;
    }

    .header-title {
        font-size: 21px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .detalle-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .options {
        grid-template-columns: 1fr;
    }

    .card,
    .question-card {
        padding: 25px;
    }
}

@media (max-width: 600px) {

    .header-content {
        flex-direction: column;
        align-items: flex-start;
    }

    .header-title {
        text-align: left;
        font-size: 19px;
    }

    .container {
        padding: 0 14px 35px;
        margin-top: 20px;
    }

    .card,
    .question-card {
        border-radius: 16px;
        padding: 20px;
    }

    .card-title {
        font-size: 23px;
    }

    .field label {
        font-size: 16px;
    }

    .field input,
    .field select {
        height: 56px;
        font-size: 16px;
    }

    .detalle-grid {
        grid-template-columns: 1fr;
    }

    .actions {
        flex-direction: column;
    }

    .btn {
        width: 100%;
    }
}

</style>
</head>

<body>

<header class="header">

    <div class="header-content">

        <img
        src="https://carsair2026-bi.github.io/Formulario_CyC/logo.png"
        class="logo"
        alt="Carsa">

        <div class="header-title">
            Registro de Gestión Comercial
        </div>

    </div>

</header>

<main class="container">

    <div
        id="mensaje"
        class="message"
    ></div>

    <form id="formulario">

        <div class="card">

            <h2 class="card-title">
                Datos del registro
            </h2>

            <div class="grid">

                <div class="field">

                    <label for="region">
                        Región
                        <span class="required">*</span>
                    </label>

                    <select
                        id="region"
                        required
                    >
                        <option value="">
                            Seleccione región
                        </option>
                    </select>

                </div>

                <div class="field">

                    <label for="codigoTienda">
                        Tienda
                        <span class="required">*</span>
                    </label>

                    <select
                        id="codigoTienda"
                        required
                        disabled
                    >
                        <option value="">
                            Seleccione tienda
                        </option>
                    </select>

                </div>

                <div class="field">

                    <label for="dniFuncionario">
                        DNI funcionario
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="dniFuncionario"
                        maxlength="15"
                        autocomplete="off"
                        required
                    >

                </div>

                <div class="field">

                    <label for="dniCliente">
                        Cliente
                        <span class="required">*</span>
                    </label>

                    <select
                        id="dniCliente"
                        required
                        disabled
                    >
                        <option value="">
                            Seleccione cliente
                        </option>
                    </select>

                </div>

                <div class="field">

                    <label for="tipoDocCliente">
                        Tipo documento cliente
                        <span class="required">*</span>
                    </label>

                    <select
                        id="tipoDocCliente"
                        required
                    >

                        <option value="">
                            Seleccione
                        </option>

                        <option value="DNI">
                            DNI
                        </option>

                        <option value="CE">
                            CE
                        </option>

                        <option value="PASAPORTE">
                            PASAPORTE
                        </option>

                        <option value="OTRO">
                            OTRO
                        </option>

                    </select>

                </div>

            </div>

        </div>

        <div class="card" id="tarjetaDetalleCliente" style="display:none;">

            <h2 class="card-title">
                📋 Información de la última solicitud
            </h2>

            <div class="grid detalle-grid" id="detalleClienteContenido">
            </div>

        </div>

        <div id="contenedorPreguntas">

            <div class="question-card">

                <div class="loading">
                    Cargando preguntas...
                </div>

            </div>

        </div>

        <div class="card">

            <div class="actions">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="limpiarFormulario()"
                >
                    Limpiar
                </button>

                <button
                    type="submit"
                    id="btnGuardar"
                    class="btn btn-primary"
                >
                    Registrar
                </button>

            </div>

        </div>

    </form>

</main>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbxjuKy636oJTr1HSD--BqYSpMYy5oeqiNUL_sbnXeJNTuAvAokPSnqvJuQiKSSbe2HeMA/exec';

let preguntas = [];

let maestro = {
    REGIONES: [],
    TIENDAS: {},
    CLIENTES: {},
    DETALLE: {}
};

let cargasPendientes = 0;

// Campos mostrados en el panel de detalle del cliente, en el orden
// en que aparecen. "ancho: 'completo'" hace que ocupen todo el ancho
// de la fila (útil para el comentario, que suele ser largo).
const CAMPOS_DETALLE = [
    { clave: 'VSO_ID', etiqueta: 'N.º de solicitud' },
    { clave: 'VSO_ESTADO_SOLICITUD', etiqueta: 'Estado de la solicitud' },
    { clave: 'VSO_FECHA_ENVIO', etiqueta: 'Fecha de envío' },
    { clave: 'VSO_FECHA_ULT_ACT', etiqueta: 'Última actualización' },
    { clave: 'APR_PERFIL_TXT', etiqueta: 'Perfil' },
    { clave: 'VSO_PERFIL_APROBADO', etiqueta: 'Perfil aprobado' },
    { clave: 'APR_FILTROS', etiqueta: 'Filtro aplicado' },
    { clave: 'PER_TIPO_IDENTIFICACION', etiqueta: 'Tipo de documento' },
    { clave: 'VSO_TIPO_SOLICITUD', etiqueta: 'Tipo de solicitud' },
    { clave: 'VSO_ORIGEN_SOLICITUD', etiqueta: 'Origen de la solicitud' },
    { clave: 'VSO_TIPO_ODV', etiqueta: 'Tipo ODV' },
    { clave: 'VSO_PRODUCTO_PVP', etiqueta: 'Producto (PVP)' },
    { clave: 'VSO_CATEGORIA_MOTO', etiqueta: 'Categoría moto' },
    { clave: 'VSO_CUPO_SOLICITADO', etiqueta: 'Cupo solicitado' },
    { clave: 'VSO_CUPO_APROBADO', etiqueta: 'Cupo aprobado' },
    { clave: 'VSO_CUPO_DISPONIBLE', etiqueta: 'Cupo disponible' },
    { clave: 'VSO_TASA_SOLICITADA', etiqueta: 'Tasa solicitada' },
    { clave: 'VSO_TASA_APROBADA', etiqueta: 'Tasa aprobada' },
    { clave: 'VSO_TASA_ETIQUETA', etiqueta: 'Tasa etiqueta' },
    { clave: 'VSO_INICIAL_SOLICITADA', etiqueta: 'Inicial solicitada' },
    { clave: 'VSO_INICIAL_APROBADA', etiqueta: 'Inicial aprobada' },
    { clave: 'VSO_PLAZO_SOLICITADO', etiqueta: 'Plazo solicitado' },
    { clave: 'VSO_PLAZO', etiqueta: 'Plazo' },
    { clave: 'VSO_CUOTA_SOLICITADA', etiqueta: 'Cuota solicitada' },
    { clave: 'VSO_MONTO', etiqueta: 'Monto' },
    { clave: 'VSO_MAF', etiqueta: 'MAF' },
    { clave: 'VSO_ASIGNACION_INGRESOS', etiqueta: 'Asignación de ingresos' },
    { clave: 'VSO_GARANTE', etiqueta: 'Garante' },
    { clave: 'VSO_COMENTARIO', etiqueta: 'Comentario', ancho: 'completo' }
];

document.addEventListener(
    'DOMContentLoaded',
    iniciar
);

function iniciar() {

    cargasPendientes = 2;

    cargarMaestroJSONP();

    cargarPreguntasJSONP();
}

function cargarMaestroJSONP() {

    ejecutarJSONP(
        'maestro',
        function(resultado) {

            cargasPendientes--;

            if (
                !resultado ||
                resultado.ok !== true
            ) {
                mostrarMensaje(
                    resultado?.mensaje ||
                    'No se pudo cargar la información inicial.',
                    'error'
                );
                return;
            }

            maestro = resultado.data;

            cargarRegiones();

        },
        function() {

            cargasPendientes--;

            mostrarMensaje(
                'No se pudo cargar la información inicial.',
                'error'
            );
        }
    );
}

function cargarPreguntasJSONP() {

    ejecutarJSONP(
        'preguntas',
        function(resultado) {

            cargasPendientes--;

            const contenedor =
                document.getElementById(
                    'contenedorPreguntas'
                );

            if (
                !resultado ||
                resultado.ok !== true
            ) {

                contenedor.innerHTML = `
                    <div class="question-card">
                        <div class="message error" style="display:block">
                            ${
                                resultado?.mensaje ||
                                'No se pudieron cargar las preguntas.'
                            }
                        </div>
                    </div>
                `;

                return;
            }

            preguntas = resultado.data || [];

            renderizarPreguntas();

        },
        function() {

            cargasPendientes--;

            document.getElementById(
                'contenedorPreguntas'
            ).innerHTML = `
                <div class="question-card">
                    <div class="message error" style="display:block">
                        No se pudieron cargar las preguntas.
                    </div>
                </div>
            `;
        }
    );
}

function ejecutarJSONP(
    action,
    success,
    error
) {

    const callbackName =
        'jsonp_' +
        Date.now() +
        '_' +
        Math.floor(
            Math.random() * 100000
        );

    const script =
        document.createElement('script');

    const timeout =
        setTimeout(function() {

            limpiar();

            if (error) {
                error();
            }

        }, 20000);

    function limpiar() {

        clearTimeout(timeout);

        if (script.parentNode) {
            script.parentNode.removeChild(
                script
            );
        }

        try {
            delete window[
                callbackName
            ];
        } catch (e) {
            window[
                callbackName
            ] = undefined;
        }
    }

    window[callbackName] = function(data) {

          console.log('JSONP OK', action, data);
        
          limpiar();
        
          success(data);
        
        };


    script.src =
        API_URL +
        '?action=' +
        encodeURIComponent(action) +
        '&callback=' +
        encodeURIComponent(callbackName) +
        '&t=' +
        Date.now();

    script.onerror = function(errorEvent) {
        
          console.error(
            'JSONP ERROR',
            action,
            errorEvent
          );
        
          limpiar();
        
          if (error) {
            error();
          }
        
        };

    document.body.appendChild(
        script
    );
}

function cargarRegiones() {

    const select =
        document.getElementById(
            'region'
        );

    select.innerHTML =
        '<option value="">Seleccione región</option>';

    maestro.REGIONES.forEach(
        function(region) {

            const option =
                document.createElement(
                    'option'
                );

            option.value = region;
            option.textContent = region;

            select.appendChild(
                option
            );
        }
    );
}

document
    .getElementById('region')
    .addEventListener(
        'change',
        cargarTiendas
    );

function cargarTiendas() {

    const region =
        document.getElementById(
            'region'
        ).value;

    const tienda =
        document.getElementById(
            'codigoTienda'
        );

    const cliente =
        document.getElementById(
            'dniCliente'
        );

    tienda.innerHTML =
        '<option value="">Seleccione tienda</option>';

    cliente.innerHTML =
        '<option value="">Seleccione cliente</option>';

    tienda.disabled = true;
    cliente.disabled = true;

    ocultarDetalleCliente();

    if (!region) {
        return;
    }

    // maestro.TIENDAS[region] es una lista de {codigo, nombre}.
    // Se muestra el nombre, pero el valor guardado es el código.
    const tiendas =
        maestro.TIENDAS[region] || [];

    tiendas.forEach(
        function(t) {

            const option =
                document.createElement(
                    'option'
                );

            option.value = t.codigo;
            option.textContent = t.nombre;

            tienda.appendChild(
                option
            );
        }
    );

    tienda.disabled =
        tiendas.length === 0;
}

document
    .getElementById('codigoTienda')
    .addEventListener(
        'change',
        cargarClientes
    );

function cargarClientes() {

  const codigoTienda =
    document.getElementById(
      'codigoTienda'
    ).value;

  const cliente =
    document.getElementById(
      'dniCliente'
    );

  cliente.innerHTML =
    '<option value="">Seleccione cliente</option>';

  cliente.disabled = true;

  ocultarDetalleCliente();

  if (!codigoTienda) {
    return;
  }

  // maestro.CLIENTES[codigoTienda] es una lista de {dni, nombre}.
  // Se muestra el nombre del cliente, pero el valor guardado es el DNI.
  const clientes =
    maestro.CLIENTES[codigoTienda] || [];

  clientes.forEach(function(c) {

    const option =
      document.createElement(
        'option'
      );

    option.value = c.dni;
    option.textContent = c.nombre;

    cliente.appendChild(option);

  });

  cliente.disabled =
    clientes.length === 0;
}

document
    .getElementById('dniCliente')
    .addEventListener(
        'change',
        mostrarDetalleCliente
    );

function ocultarDetalleCliente() {

    document.getElementById(
        'tarjetaDetalleCliente'
    ).style.display = 'none';
}

function claseBadgeEstado(estado) {

    const valor =
        String(estado)
            .trim()
            .toLowerCase();

    if (valor.indexOf('aprob') !== -1) {
        return 'badge-aprobado';
    }

    if (valor.indexOf('rechaz') !== -1) {
        return 'badge-rechazado';
    }

    if (valor.indexOf('pendiente') !== -1) {
        return 'badge-pendiente';
    }

    return 'badge-otro';
}

function mostrarDetalleCliente() {

    const tarjeta =
        document.getElementById(
            'tarjetaDetalleCliente'
        );

    const contenido =
        document.getElementById(
            'detalleClienteContenido'
        );

    const codigoTienda =
        document.getElementById(
            'codigoTienda'
        ).value;

    const dni =
        document.getElementById(
            'dniCliente'
        ).value;

    if (!codigoTienda || !dni) {
        tarjeta.style.display = 'none';
        return;
    }

    const clave =
        codigoTienda + '|' + dni;

    const detalle =
        (maestro.DETALLE || {})[clave];

    contenido.innerHTML = '';

    if (!detalle) {

        contenido.innerHTML = `
            <div class="empty">
                No hay información adicional registrada para este cliente en esta tienda.
            </div>
        `;

        tarjeta.style.display = 'block';

        return;
    }

    CAMPOS_DETALLE.forEach(
        function(campo) {

            const valor =
                detalle[campo.clave];

            if (
                valor === undefined ||
                valor === null ||
                String(valor).trim() === ''
            ) {
                return;
            }

            const item =
                document.createElement(
                    'div'
                );

            item.className =
                'detalle-item' +
                (
                    campo.ancho === 'completo'
                        ? ' detalle-item-completo'
                        : ''
                );

            let valorHtml =
                escaparHTML(valor);

            if (campo.clave === 'VSO_ESTADO_SOLICITUD') {

                valorHtml = `
                    <span class="badge-estado ${claseBadgeEstado(valor)}">
                        ${escaparHTML(valor)}
                    </span>
                `;
            }

            item.innerHTML = `
                <div class="detalle-etiqueta">${escaparHTML(campo.etiqueta)}</div>
                <div class="detalle-valor">${valorHtml}</div>
            `;

            contenido.appendChild(item);
        }
    );

    if (!contenido.children.length) {

        contenido.innerHTML = `
            <div class="empty">
                No hay información adicional registrada para este cliente en esta tienda.
            </div>
        `;
    }

    tarjeta.style.display = 'block';
}

function renderizarPreguntas() {

    const contenedor =
        document.getElementById(
            'contenedorPreguntas'
        );

    if (!preguntas.length) {

        contenedor.innerHTML = `
            <div class="question-card">
                <div class="empty">
                    No existen preguntas activas.
                </div>
            </div>
        `;

        return;
    }

    contenedor.innerHTML = '';

    preguntas.forEach(
        function(
            pregunta,
            index
        ) {

            const card =
                document.createElement(
                    'div'
                );

            card.className =
                'question-card';

            const numero =
                document.createElement(
                    'div'
                );

            numero.className =
                'question-number';

            numero.textContent =
                index + 1;

            const titulo =
                document.createElement(
                    'div'
                );

            titulo.className =
                'question-title';

            titulo.innerHTML =
                escaparHTML(
                    pregunta.PREGUNTA
                ) +
                ' <span class="required">*</span>';

            const opciones =
                document.createElement(
                    'div'
                );

            opciones.className =
                'options';

            pregunta.RESPUESTAS.forEach(
                function(
                    respuesta,
                    respuestaIndex
                ) {

                    const option =
                        document.createElement(
                            'div'
                        );

                    option.className =
                        'option';

                    const idRadio =
                        'pregunta_' +
                        pregunta.ID_PREGUNTA +
                        '_' +
                        respuestaIndex;

                    option.innerHTML = `
                        <input
                            type="radio"
                            id="${idRadio}"
                            name="pregunta_${pregunta.ID_PREGUNTA}"
                            value="${escaparHTML(respuesta.ID_RESPUESTA)}"
                            required
                        >

                        <label for="${idRadio}">
                            ${escaparHTML(respuesta.RESPUESTA)}
                        </label>
                    `;

                    opciones.appendChild(
                        option
                    );
                }
            );

            card.appendChild(
                numero
            );

            card.appendChild(
                titulo
            );

            card.appendChild(
                opciones
            );

            contenedor.appendChild(
                card
            );
        }
    );
}

document
    .getElementById('formulario')
    .addEventListener(
        'submit',
        enviarFormulario
    );

async function enviarFormulario(
    event
) {

    event.preventDefault();

    ocultarMensaje();

    const formulario =
        document.getElementById(
            'formulario'
        );

    if (!formulario.checkValidity()) {

        formulario.reportValidity();

        return;
    }

    const respuestas = [];

    for (
        const pregunta of preguntas
    ) {

        const seleccionada =
            document.querySelector(
                `input[name="pregunta_${pregunta.ID_PREGUNTA}"]:checked`
            );

        if (!seleccionada) {

            mostrarMensaje(
                'Debe responder todas las preguntas.',
                'error'
            );

            return;
        }

        respuestas.push({
            ID_PREGUNTA:
                pregunta.ID_PREGUNTA,

            ID_RESPUESTA:
                seleccionada.value
        });
    }

    // CODIGO_TIENDA ya viaja con el código de tienda (no el nombre),
    // porque el <select> de tienda ahora usa t.codigo como value.
    const payload = {

        REGION:
            document.getElementById(
                'region'
            ).value,

        CODIGO_TIENDA:
            document.getElementById(
                'codigoTienda'
            ).value,

        DNI_FUNCIONARIO:
            document.getElementById(
                'dniFuncionario'
            ).value.trim(),

        TIPO_DOC_CLIENTE:
            document.getElementById(
                'tipoDocCliente'
            ).value,

        DNI_CLIENTE:
            document.getElementById(
                'dniCliente'
            ).value,

        RESPUESTAS:
            respuestas
    };

    const boton =
        document.getElementById(
            'btnGuardar'
        );

    boton.disabled = true;
    boton.textContent =
        'Registrando...';

    try {

        await fetch(
            API_URL,
            {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type':
                        'text/plain;charset=utf-8'
                },
                body:
                    JSON.stringify(
                        payload
                    )
            }
        );

        mostrarMensaje(
            'Registro guardado correctamente.',
            'success'
        );

        limpiarFormulario(
            false
        );

        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

    } catch (error) {

        mostrarMensaje(
            'No se pudo enviar el registro.',
            'error'
        );

    } finally {

        boton.disabled = false;

        boton.textContent =
            'Registrar';
    }
}

function limpiarFormulario(
    mostrar = true
) {

    document
        .getElementById(
            'formulario'
        )
        .reset();

    const tienda =
        document.getElementById(
            'codigoTienda'
        );

    const cliente =
        document.getElementById(
            'dniCliente'
        );

    tienda.innerHTML =
        '<option value="">Seleccione tienda</option>';

    cliente.innerHTML =
        '<option value="">Seleccione cliente</option>';

    tienda.disabled = true;
    cliente.disabled = true;

    ocultarDetalleCliente();

    document
        .querySelectorAll(
            'input[type="radio"]'
        )
        .forEach(
            function(input) {
                input.checked = false;
            }
        );

    if (mostrar) {
        ocultarMensaje();
    }
}

function mostrarMensaje(
    texto,
    tipo
) {

    const mensaje =
        document.getElementById(
            'mensaje'
        );

    mensaje.textContent =
        texto;

    mensaje.className =
        'message ' + tipo;
}

function ocultarMensaje() {

    const mensaje =
        document.getElementById(
            'mensaje'
        );

    mensaje.textContent = '';

    mensaje.className =
        'message';
}

function escaparHTML(valor) {

  return String(valor)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');

}
